<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" width="1500" height="820">
<defs>
  <style>
    .ln{fill:none;stroke:#E8E1D0;stroke-linecap:round;stroke-linejoin:round}
    .t{font-family:'Noto Serif','DejaVu Serif',serif;fill:#14202B;letter-spacing:4px;text-anchor:middle}
    .c{font-family:'DejaVu Sans',sans-serif;fill:#6B7680;font-size:16px;text-anchor:middle}
  </style>
  <!-- Kim cang chử (vajra) dọc, tâm 0,0 -->
  <g id="vajra" class="ln" stroke-width="5">
    <circle cx="0" cy="0" r="9"/>
    <path d="M0 -9 V-26 M0 9 V26"/>
    <path d="M-14 -26 H14 M-14 26 H14"/>
    <path d="M0 -26 V-78 M0 26 V78"/>
    <path d="M-6 -30 C-30 -45 -26 -66 -4 -78 M6 -30 C30 -45 26 -66 4 -78"/>
    <path d="M-6 30 C-30 45 -26 66 -4 78 M6 30 C30 45 26 66 4 78"/>
  </g>
  <!-- Hoa sen (Tịnh độ) tâm đáy 0,0 -->
  <g id="lotus" class="ln" stroke-width="4">
    <path d="M0 0 C-14 -20 -14 -44 0 -60 C14 -44 14 -20 0 0Z"/>
    <path d="M-4 -2 C-30 -10 -42 -32 -40 -50 C-22 -44 -10 -28 -4 -2"/>
    <path d="M4 -2 C30 -10 42 -32 40 -50 C22 -44 10 -28 4 -2"/>
    <path d="M-8 2 C-40 4 -60 -10 -66 -24 M8 2 C40 4 60 -10 66 -24"/>
  </g>
  <!-- Bộ thuỷ 氵 ba giọt -->
  <g id="thuy" fill="#E8E1D0">
    <path d="M0 0 c10 4 16 12 14 20 c-8 -2 -16 -10 -14 -20z"/>
    <path d="M-2 40 c10 4 16 12 14 20 c-8 -2 -16 -10 -14 -20z"/>
    <path d="M-6 112 q12 -24 30 -36 q-6 24 -26 40z"/>
  </g>
</defs>
<rect width="1500" height="820" fill="#F4F1EA"/>

<!-- ===== A: Sen – Kim cang – Sóng ===== -->
<g transform="translate(250 60)">
  <path d="M-130 0 H130 V500 H-130 Z" fill="#101B26"/>
  <rect x="-116" y="14" width="232" height="472" fill="none" stroke="#E8E1D0" stroke-width="1.5" opacity=".5"/>
  <use href="#lotus" transform="translate(0 150)"/>
  <use href="#vajra" transform="translate(0 375) scale(.8)"/>
  <!-- 2 sóng giữa -->
  <path class="ln" stroke-width="5" d="M-116 238 C-80 214 -48 214 -16 238 S48 262 80 238 S106 222 116 230"/>
  <path class="ln" stroke-width="5" d="M-116 262 C-80 238 -48 238 -16 262 S48 286 80 262 S106 246 116 254"/>
  <use href="#thuy" transform="translate(-92 380) scale(.7)"/>
  <text class="t" y="560" font-size="30">PHONG THUỶ LÀ TỊNH</text>
  <text class="c" y="610">A · Sen – Kim cang – Sóng</text>
</g>

<!-- ===== B: Rồng sóng – cờ đuôi én ===== -->
<g transform="translate(750 60)">
  <path d="M-130 0 H130 V500 L0 450 L-130 500 Z" fill="#101B26"/>
  <!-- vầng sáng + vajra ngang trên đỉnh -->
  <circle class="ln" stroke-width="2" cx="0" cy="110" r="62" opacity=".6"/>
  <use href="#vajra" transform="translate(0 110) rotate(90) scale(.7)"/>
  <!-- 2 sóng = thân rồng, đầu rồng cuộn ở phải -->
  <path class="ln" stroke-width="6" d="M-112 250 C-80 220 -40 220 -10 250 S50 280 80 250 C96 234 104 216 92 204 C82 196 70 204 76 214"/>
  <path class="ln" stroke-width="6" d="M-112 286 C-80 256 -40 256 -10 286 S50 316 80 286 C92 274 104 266 116 270"/>
  <!-- vảy rồng -->
  <path class="ln" stroke-width="2.5" d="M-60 244 q8 -8 16 0 M-30 240 q8 -8 16 0 M14 262 q8 -8 16 0 M44 266 q8 -8 16 0"/>
  <use href="#lotus" transform="translate(0 400) scale(.8)"/>
  <text class="t" y="560" font-size="30">PHONG THUỶ LÀ TỊNH</text>
  <text class="c" y="610">B · Rồng sóng – cờ đuôi én</text>
</g>

<!-- ===== C: Chữ 淨 cách điệu ===== -->
<g transform="translate(1250 60)">
  <path d="M-130 0 H130 V500 H-130 Z" fill="#101B26"/>
  <path d="M-130 0 H130 V36 H-130Z M-130 464 H130 V500 H-130Z" fill="#1B2A38"/>
  <!-- 氵 bên trái -->
  <use href="#thuy" transform="translate(-86 120)"/>
  <!-- 爭 bên phải: móng trên, vajra làm nét sổ, sóng làm nét ngang -->
  <path class="ln" stroke-width="5" d="M-10 100 Q30 82 70 96 M10 118 L22 108 M44 112 L54 102 M74 118 L66 108"/>
  <use href="#vajra" transform="translate(30 300) scale(1.25)"/>
  <path class="ln" stroke-width="5" d="M-116 258 C-80 236 -50 236 -20 258 S40 280 70 258 S104 242 116 250"/>
  <path class="ln" stroke-width="5" d="M-116 290 C-80 268 -50 268 -20 290 S40 312 70 290 S104 274 116 282"/>
  <!-- râu rồng cuộn -->
  <path class="ln" stroke-width="3" d="M-4 400 c-30 10 -50 -6 -40 -24 c8 -12 24 -6 20 6"/>
  <text class="t" y="560" font-size="30">PHONG THUỶ LÀ TỊNH</text>
  <text class="c" y="610">C · Chữ 淨 cách điệu</text>
</g>
<text class="c" x="750" y="780">Phác thảo lần 1 · Xanh than #101B26 · chưa phải bản hoàn thiện</text>
</svg>
