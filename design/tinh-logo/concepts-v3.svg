<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" width="1500" height="820">
<defs>
  <style>
    .ln{fill:none;stroke:#E8E1D0;stroke-linecap:round;stroke-linejoin:round}
    .t{font-family:'Noto Serif','DejaVu Serif',serif;fill:#14202B;letter-spacing:4px;text-anchor:middle}
    .c{font-family:'DejaVu Sans',sans-serif;fill:#6B7680;font-size:16px;text-anchor:middle}
  </style>
  <!-- Kim cang chử (vajra) dọc, tâm 0,0 -->
  <g id="vajra" class="ln" stroke-width="5">
    <circle cx="0" cy="0" r="9"/>
    <path d="M0 -9 V-26 M0 9 V26"/>
    <path d="M-14 -26 H14 M-14 26 H14"/>
    <path d="M0 -26 V-78 M0 26 V78"/>
    <path d="M-6 -30 C-30 -45 -26 -66 -4 -78 M6 -30 C30 -45 26 -66 4 -78"/>
    <path d="M-6 30 C-30 45 -26 66 -4 78 M6 30 C30 45 26 66 4 78"/>
  </g>
  <!-- Hoa sen (Tịnh độ) tâm đáy 0,0 -->
  <g id="lotus" class="ln" stroke-width="4">
    <path d="M0 0 C-14 -20 -14 -44 0 -60 C14 -44 14 -20 0 0Z"/>
    <path d="M-4 -2 C-30 -10 -42 -32 -40 -50 C-22 -44 -10 -28 -4 -2"/>
    <path d="M4 -2 C30 -10 42 -32 40 -50 C22 -44 10 -28 4 -2"/>
    <path d="M-8 2 C-40 4 -60 -10 -66 -24 M8 2 C40 4 60 -10 66 -24"/>
  </g>
  <!-- Bộ thuỷ 氵 ba giọt -->
  <g id="thuy" fill="#E8E1D0">
    <path d="M0 0 c10 4 16 12 14 20 c-8 -2 -16 -10 -14 -20z"/>
    <path d="M-2 40 c10 4 16 12 14 20 c-8 -2 -16 -10 -14 -20z"/>
    <path d="M-6 112 q12 -24 30 -36 q-6 24 -26 40z"/>
  </g>
</defs>
<rect width="1500" height="820" fill="#F4F1EA"/>
<g transform="translate(250 60)"><path d="M-130 0 H130 V500 H-130 Z" fill="#101B26"/><path class="ln" stroke-width="5" d="M-130 0 C-60 80 -110 170 -20 240 S90 340 130 500"/><path class="ln" stroke-width="5" d="M-130 0 C-40 70 -80 180 10 230 S120 360 130 500"/>
  <use href="#lotus" transform="translate(60 120) scale(.7)"/>
  <use href="#vajra" transform="translate(-70 380) scale(.6)"/>
  <text class="t" y="560" font-size="30">PHONG THUỶ LÀ TỊNH</text>
  <text class="c" y="610">A · Từ góc trên trái chéo xuống góc dưới phải</text></g>
<g transform="translate(750 60)"><path d="M-130 0 H130 V500 H-130 Z" fill="#101B26"/><path class="ln" stroke-width="5" d="M-130 0 C-50 60 -120 160 -40 220 S60 230 130 300"/><path class="ln" stroke-width="5" d="M-130 0 C-30 50 -90 170 -10 200 S80 200 130 260"/>
  <use href="#lotus" transform="translate(60 110) scale(.65)"/>
  <use href="#vajra" transform="translate(0 390) scale(.75)"/>
  <text class="t" y="560" font-size="30">PHONG THUỶ LÀ TỊNH</text>
  <text class="c" y="610">B · Từ góc trên trái, thoát ra cạnh phải</text></g>
<g transform="translate(1250 60)"><path d="M-130 0 H130 V500 H-130 Z" fill="#101B26"/><path class="ln" stroke-width="5" d="M-130 0 C-40 90 -110 200 -30 280 S20 420 0 500"/><path class="ln" stroke-width="5" d="M-130 0 C-20 80 -80 210 0 270 S50 420 30 500"/>
  <use href="#lotus" transform="translate(70 130) scale(.65)"/>
  <use href="#vajra" transform="translate(-75 400) scale(.55)"/>
  <text class="t" y="560" font-size="30">PHONG THUỶ LÀ TỊNH</text>
  <text class="c" y="610">C · Từ góc trên trái chảy xuống đáy</text></g>
<text class="c" x="750" y="780">Phác thảo lần 3 · Hai nét sóng cùng xuất phát từ một góc</text></svg>